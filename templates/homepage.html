
{% block content %}

<div class="row">
    <div class="col-12 text-center mb-4">
        <h1 class="mt-3">Witaj w mojej bibliotece filmów</h1>
        <p class="lead">Znajdziesz tutaj tylko najlepsze tytuły!</p>
    </div>
</div>

<!-- Przyciski wyboru listy -->
<div class="row mb-4">
    <div class="col-12 text-center">
        {% for lista in lists %}
        <a href="{{ url_for('homepage', list_type=lista) }}"
           class="btn me-2 {% if lista == current_list %}btn-info{% else %}btn-outline-info{% endif %}">
            {{ lista | replace("_", " ") | title }}
        </a>
        {% endfor %}
    </div>
</div>

<!-- Lista filmów -->
<div class="row">
    {% for movie in movies %}
    <div class="col-lg-3 col-md-6 mb-4">
        <div class="card h-100 bg-dark text-white">
            <img class="card-img-top" 
                 src="{% if movie.poster_path %}{{ tmdb_image_url(movie.poster_path, 'w342') }}{% else %}https://placehold.it/342x500{% endif %}" 
                 alt="{{ movie.title }}">
            <div class="card-body">
                <h5 class="card-title">{{ movie.title }}</h5>
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('movie_details', movie_id=movie.id) }}" class="btn btn-primary">Pokaż więcej</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
